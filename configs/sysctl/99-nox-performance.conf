# Nox Performance Sysctl (non-overlapping complement to cachyos-settings 70-cachyos-settings.conf)
# Gaming & heavy mmap compatibility (DXVK/VKD3D/Proton/LLVM)
vm.max_map_count = 2147483642

# Prevent split-lock frame-time stalls in Windows/Wine/Proton workloads
kernel.split_lock_mitigate = 0

# Faster TCP connection setup & PMTUD reliability
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
