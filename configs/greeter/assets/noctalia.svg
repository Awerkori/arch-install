<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="noxAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#581c87" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090610" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldOmega" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleLambda" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="30%" stop-color="#a855f7"/>
      <stop offset="75%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="ringOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="244" fill="url(#noxAura)"/>

  <!-- Subtle outer dashed cosmic orbit -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#ringOuter)" stroke-width="4" stroke-dasharray="32 14 8 12" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="#b973fa" stroke-width="2.6" stroke-opacity="0.72" stroke-dasharray="14 12" stroke-linecap="round"/>

  <!-- Top & Bottom satellites -->
  <circle cx="256" cy="38" r="8" fill="#fef08a"/>
  <circle cx="256" cy="38" r="3.6" fill="#ffffff"/>
  <circle cx="256" cy="448" r="6.5" fill="#d946ef"/>
  <circle cx="256" cy="448" r="2.8" fill="#fdf4ff"/>

  <!-- Ornamental crescent ring behind emblem -->
  <path d="M 140 316 A 138 138 0 1 1 372 316" fill="none" stroke="#fbbf24" stroke-width="4.2" stroke-opacity="0.88"/>
  <!-- Cardinal 4-point diamond stars on crescent -->
  <path d="M256,88 L262,110 L284,116 L262,122 L256,144 L250,122 L228,116 L250,110 Z" fill="#fef08a" stroke="#b45309" stroke-width="1.5"/>
  <path d="M118,242 L123,257 L138,262 L123,267 L118,282 L113,267 L98,262 L113,257 Z" fill="#fbbf24" stroke="#92400e" stroke-width="1.2"/>
  <path d="M394,242 L399,257 L414,262 L399,267 L394,282 L389,267 L374,262 L389,257 Z" fill="#fbbf24" stroke="#92400e" stroke-width="1.2"/>

  <!-- Gold Omega -->
  <path d="M 196 320
           A 104 104 0 1 1 316 320
           L 316 340
           L 360 340
           L 360 384
           L 280 384
           L 280 324
           A 64 64 0 1 0 232 324
           L 232 384
           L 152 384
           L 152 340
           L 196 340 Z"
        fill="url(#goldOmega)" stroke="#78350f" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- Central Cosmic Purple Lambda Chevron -->
  <path d="M 256 156 L 348 342 L 310 342 L 256 232 L 202 342 L 164 342 Z"
        fill="url(#purpleLambda)" stroke="#f5f3ff" stroke-opacity="0.7" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
