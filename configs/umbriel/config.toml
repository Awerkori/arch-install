# Nox Archinstall — Umbriel Configuration (Hyprland + Ambxst Keybind Parity + Dwindle)

[include.optional]
files = ["outputs.toml", "outputs.local.toml"]

[general]
autostart = ["noctalia"]
mod_key = "Super"
xwayland = true
xwayland_native_resolution = false
xwayland_xsettings = true
show_cheatsheet = false
focus_on_activate = false
honor_restored_maximize = false

[environment]
LANG = "en_CA.UTF-8"
LC_MESSAGES = "en_CA.UTF-8"
LANGUAGE = "en_CA:en_US:en"
QT_QPA_PLATFORMTHEME = "qt6ct"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
AMD_VULKAN_ICD = "RADV"
MESA_SHADER_CACHE_MAX_SIZE = "12G"

[workspaces]
back_and_forth = false
empty_above = false

[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 10
drag_opacity = 0.75

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[appearance.shadow]
enabled = true
softness = 10
offset_x = 2
offset_y = 2

[input]
middle_click_paste = true
client_window_drag = true
window_drag_toggle = "none"

[input.keyboard]
layout = "us"
variant = "intl"
options = ""
repeat_rate = 25
repeat_delay = 600
numlock_toggle = true
track_layout = "global"

[input.mouse]
sensitivity = 0.0
scroll_wheel_step = 60

[input.cursor]
theme = "Adwaita"
size = 24
hardware_cursor = true
follows_focus = false
hide_when_typing = false

[input.focus]
follows_mouse = "sloppy"

[layout]
mode = "dwindle"
gap = 0
extent_presets = [0.333, 0.5, 0.667]

[layout.dwindle]
preserve_split = false
new_toward_cursor = false

# Defining [keybinds] replaces Umbriel's built-in bind set completely.
# Matches active Hyprland + Ambxst keybinds (precedence preserved; no invented binds).
# Built-in Super+MouseLeft drag (move) and Super+MouseRight drag (resize) remain active.
[keybinds]
# Core apps & session
"Mod+Q" = { action = "spawn kitty", repeat = false }
"Mod+E" = { action = "spawn luciole", repeat = false }
"Ctrl+E" = { action = "spawn luciole", repeat = false }
"Mod" = "spawn noctalia msg panel-toggle launcher"
"Mod+R" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+M" = { action = "session-quit", repeat = false }
"Mod+Escape" = { action = "spawn noctalia msg panel-toggle session", repeat = false }
"Mod+L" = { action = "spawn noctalia msg session lock", repeat = false }

# Noctalia panels & tools (Ambxst replacements)
"Mod+D" = { action = "spawn noctalia msg panel-toggle control-center", repeat = false }
"Mod+V" = { action = "spawn noctalia msg panel-toggle clipboard", repeat = false }
"Mod+Period" = { action = "spawn noctalia msg panel-toggle launcher /emo", repeat = false }
"Mod+Comma" = { action = "spawn noctalia msg panel-toggle wallpaper", repeat = false }
"Mod+Tab" = { action = "overview-toggle", repeat = false }
"Mod+Shift+C" = { action = "spawn noctalia msg settings-toggle", repeat = false }
"Mod+Shift+S" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Mod+Shift+A" = { action = "spawn noctalia msg screenshot-annotate", repeat = false }
"Mod+Shift+B" = { action = "spawn noctalia msg bar-toggle", repeat = false }
"Mod+Alt+B" = { action = "spawn sh -c 'umbriel msg config-reload && noctalia msg config-reload'", repeat = false }

# Window actions & Dwindle
"Mod+C" = { action = "window-close", repeat = false }
"Mod+Space" = { action = "window-toggle-floating", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+J" = { action = "layout-toggle-split", repeat = false }
"Mod+Ctrl+Space" = { action = "window-center", repeat = false }
"Mod+Shift+V" = { action = "scratchpad-toggle", repeat = false }
"Mod+Alt+V" = { action = "window-move-to-scratchpad", repeat = false }

# Focus navigation (Arrows + Super+Ctrl Vim/ZX aliases)
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+Ctrl+H" = "window-focus-left"
"Mod+Ctrl+Z" = "window-focus-left"
"Mod+Ctrl+L" = "window-focus-right"
"Mod+Ctrl+X" = "window-focus-right"
"Mod+Ctrl+K" = "window-focus-up"
"Mod+Ctrl+J" = "window-focus-down"

# Move windows in Dwindle (Super+Shift+Arrows + Vim aliases)
"Mod+Shift+Left" = "window-move-left"
"Mod+Shift+H" = "window-move-left"
"Mod+Shift+Right" = "window-move-right"
"Mod+Shift+L" = "window-move-right"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+K" = "window-move-up"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+J" = "window-move-down"

# Resize windows (Super+Alt+Arrows + Vim aliases)
"Mod+Alt+Right" = "window-modify-primary-extent +0.05"
"Mod+Alt+L" = "window-modify-primary-extent +0.05"
"Mod+Alt+Left" = "window-modify-primary-extent -0.05"
"Mod+Alt+H" = "window-modify-primary-extent -0.05"
"Mod+Alt+Down" = "window-modify-secondary-extent +0.05"
"Mod+Alt+J" = "window-modify-secondary-extent +0.05"
"Mod+Alt+Up" = "window-modify-secondary-extent -0.05"
"Mod+Alt+K" = "window-modify-secondary-extent -0.05"

# Workspaces 1..10 (switch & move)
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+0" = "workspace-switch 10"
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+Shift+7" = "window-move-to-workspace 7"
"Mod+Shift+8" = "window-move-to-workspace 8"
"Mod+Shift+9" = "window-move-to-workspace 9"
"Mod+Shift+0" = "window-move-to-workspace 10"
"Mod+Alt+1" = "window-move-to-workspace 1"
"Mod+Alt+2" = "window-move-to-workspace 2"
"Mod+Alt+3" = "window-move-to-workspace 3"
"Mod+Alt+4" = "window-move-to-workspace 4"
"Mod+Alt+5" = "window-move-to-workspace 5"
"Mod+Alt+6" = "window-move-to-workspace 6"
"Mod+Alt+7" = "window-move-to-workspace 7"
"Mod+Alt+8" = "window-move-to-workspace 8"
"Mod+Alt+9" = "window-move-to-workspace 9"
"Mod+Alt+0" = "window-move-to-workspace 10"

# Workspace stepping & scroll (Ambxst precedence: WheelDown=prev, WheelUp=next)
"Mod+Z" = "workspace-previous"
"Mod+Shift+Z" = "workspace-previous"
"Mod+X" = "workspace-next"
"Mod+Shift+X" = "workspace-next"
"Mod+WheelDown" = { action = "workspace-previous", cooldown_ms = 120 }
"Mod+WheelUp" = { action = "workspace-next", cooldown_ms = 120 }

# Media, volume, mic mute & brightness (Noctalia OSD + allow_when_locked)
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up 10", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down 10", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioMicMute" = { action = "spawn noctalia msg mic-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioPause" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioStop" = { action = "spawn noctalia msg media stop", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up 5", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down 5", allow_when_locked = true }

# Window rules
[[window_rule]]
blur = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

# Layer rules
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.6
blur_optimized = false
