# Nox Archinstall — Project Nox Obsidian Purple Visual Identity
[theme]
source = "custom"
custom_palette = "ObsidianPurple"
mode = "dark"
pure_black_dark = false
shell_mode = "follow"
sync_color_scheme = true
terminal_colors = "palette"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["btop", "gtk3", "gtk4", "kitty", "qt", "umbriel"]

[shell]
avatar_path = "/usr/share/noctalia/assets/noctalia.svg"
circular_avatar = true
card_borders = true
button_borders = true
input_borders = true

[wallpaper]
directory = "/usr/share/nox-archinstall/wallpapers"
enabled = true
